services:
  api:
    build:
      context: ./api
      target: dev
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
    volumes:
      - ./api:/app
      - /app/node_modules
    command: npm run start:dev

  front:
    build:
      context: ./front
      target: dev
    ports:
      - "5173:5173"
    volumes:
      - ./front:/app
      - /app/node_modules
    depends_on:
      - api
    command: npm run dev -- --host
